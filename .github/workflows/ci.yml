name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Stub env vars for build
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_PRIVY_APP_ID: stub
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://stub:stub@localhost/stub
          ALCHEMY_API_KEY: stub
          PRIVY_APP_ID: stub
          PRIVY_APP_SECRET: stub
          NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          CRON_SECRET: stub

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test
        env:
          DATABASE_URL: postgresql://stub:stub@localhost/stub
          ALCHEMY_API_KEY: stub
          PRIVY_APP_ID: stub
          PRIVY_APP_SECRET: stub
          NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          CRON_SECRET: stub
